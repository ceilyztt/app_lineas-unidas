name: lineas_unidas
description: "App de taxi Líneas Unidas - Transporte seguro y confiable"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.7
  firebase_messaging: ^15.2.6
  firebase_storage: ^12.4.5

  # Mapas y ubicación
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.2.0
  geolocator: ^13.0.2

  # Estado
  provider: ^6.1.5

  # UI
  flutter_rating_bar: ^4.0.1
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  intl: ^0.20.2
  flutter_local_notifications: ^18.0.1
  flutter_ringtone_player: ^4.0.0+4
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
